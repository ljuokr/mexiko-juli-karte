<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mexiko im Juli · Ideen-Karte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --base:#8c3427;        /* Terracotta / Mole */
    --base-dark:#5f2015;
    --paper:#fbf7f0;
    --ink:#22221e;
    --must:#c8472e;        /* Highlights */
    --fest:#c2417f;        /* Juli-Feste */
    --tiere:#3e7d3a;       /* Tiere & Natur */
    --wasser:#0e7c86;      /* Cenoten & Baden */
    --ruine:#6b5b95;       /* Ruinen & Museen */
    --stadt:#46628c;       /* Städte & Dörfer */
    --essen:#b07c10;       /* Essen & Märkte */
    --kajak:#1272a8;       /* Kajak-Seeblau */
    --wing:#00a0bc;        /* Wingfoil-Cyan */
    --surf:#123f66;        /* Surf-Navy */
    --wandern:#7a5230;     /* Trail-Braun */
    --sam:#37474f;         /* Südamerika-Anthrazit */
    --tauch:#4527a0;       /* Tauch-Indigo */
    --velo:#71861c;        /* Velo-Oliv */
    --zone-red:#c22a1e;
    --zone-amber:#d98a1f;
    --radius:16px;
    --shadow:0 6px 24px rgba(70,25,15,.20);
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--paper);
  }
  #map{position:fixed;inset:0;z-index:1;background:#e8e2d4}

  /* ---------- Header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(var(--sat) + 10px) 14px 0;
    pointer-events:none;
  }
  .title-card{
    pointer-events:auto;position:relative;
    background:var(--base);color:#fff;
    border-radius:var(--radius);
    padding:12px 52px 10px 16px;
    box-shadow:var(--shadow);
  }
  .title-card h1{font-size:1.05rem;font-weight:700;letter-spacing:.01em;line-height:1.2}
  .title-card p{font-size:.72rem;opacity:.88;margin-top:2px}
  .info-btn{
    position:absolute;top:10px;right:10px;
    width:34px;height:34px;border-radius:50%;border:none;
    background:rgba(255,255,255,.18);color:#fff;
    font-size:17px;font-weight:700;cursor:pointer;
  }
  .info-btn:active{background:rgba(255,255,255,.32)}
  .chips{
    pointer-events:auto;
    display:flex;gap:8px;margin-top:10px;
    overflow-x:auto;scrollbar-width:none;
    padding-bottom:4px;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    border:none;border-radius:999px;
    padding:9px 14px;font-size:.82rem;font-weight:600;
    background:#fff;color:var(--ink);
    box-shadow:0 2px 10px rgba(70,25,15,.14);
    cursor:pointer;transition:transform .12s ease,opacity .15s ease;
  }
  .chip:active{transform:scale(.95)}
  .chip .dot{width:10px;height:10px;border-radius:50%}
  .chip[data-cat="must"] .dot{background:var(--must)}
  .chip[data-cat="fest"] .dot{background:var(--fest)}
  .chip[data-cat="tiere"] .dot{background:var(--tiere)}
  .chip[data-cat="wasser"] .dot{background:var(--wasser)}
  .chip[data-cat="ruine"] .dot{background:var(--ruine)}
  .chip[data-cat="stadt"] .dot{background:var(--stadt)}
  .chip[data-cat="essen"] .dot{background:var(--essen)}
  .chip[data-cat="kajak"] .dot{background:var(--kajak)}
  .chip[data-cat="wing"] .dot{background:var(--wing)}
  .chip[data-cat="surf"] .dot{background:var(--surf)}
  .chip[data-cat="wandern"] .dot{background:var(--wandern)}
  .chip[data-cat="sam"] .dot{background:var(--sam)}
  .chip[data-cat="tauch"] .dot{background:var(--tauch)}
  .chip[data-cat="velo"] .dot{background:var(--velo)}
  .chip[data-cat="all"] .dot{background:conic-gradient(var(--must) 0 7.1%,var(--fest) 7.1% 14.3%,var(--tiere) 14.3% 21.4%,var(--wasser) 21.4% 28.6%,var(--ruine) 28.6% 35.7%,var(--stadt) 35.7% 42.9%,var(--essen) 42.9% 50%,var(--kajak) 50% 57.1%,var(--wing) 57.1% 64.3%,var(--surf) 64.3% 71.4%,var(--wandern) 71.4% 78.6%,var(--sam) 78.6% 85.7%,var(--tauch) 85.7% 92.9%,var(--velo) 92.9% 100%)}
  .chip.off{opacity:.45}
  .chip.off .dot{background:#9aa3ab !important}

  /* ---------- Marker ---------- */
  .pin{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:50% 50% 50% 6px;
    font-size:19px;line-height:1;
    border:2.5px solid #fff;
    box-shadow:0 3px 10px rgba(70,25,15,.35);
  }
  .pin.must{background:var(--must)}
  .pin.fest{background:var(--fest)}
  .pin.tiere{background:var(--tiere)}
  .pin.wasser{background:var(--wasser)}
  .pin.ruine{background:var(--ruine)}
  .pin.stadt{background:var(--stadt)}
  .pin.essen{background:var(--essen)}
  .pin.kajak{background:var(--kajak)}
  .pin.wing{background:var(--wing)}
  .pin.surf{background:var(--surf)}
  .pin.wandern{background:var(--wandern)}
  .pin.sam{background:var(--sam)}
  .pin.tauch{background:var(--tauch)}
  .pin.velo{background:var(--velo)}
  .pin-badge{
    position:absolute;top:-7px;right:-7px;
    width:18px;height:18px;border-radius:50%;
    background:#e0322f;color:#fff;
    font-size:12px;font-weight:800;line-height:18px;text-align:center;
    border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
  }

  /* ---------- Bottom Sheet ---------- */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:#fff;border-radius:22px 22px 0 0;
    box-shadow:0 -8px 32px rgba(70,25,15,.22);
    padding:10px 20px calc(var(--sab) + 20px);
    transform:translateY(110%);
    transition:transform .28s cubic-bezier(.32,.72,.3,1);
    max-height:62vh;overflow-y:auto;
  }
  .sheet.open{transform:translateY(0)}
  .grabber{width:40px;height:4px;border-radius:2px;background:#d5dade;margin:0 auto 12px}
  .sheet .tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px;
  }
  .sheet .tag.must{background:var(--must)}
  .sheet .tag.fest{background:var(--fest)}
  .sheet .tag.tiere{background:var(--tiere)}
  .sheet .tag.wasser{background:var(--wasser)}
  .sheet .tag.ruine{background:var(--ruine)}
  .sheet .tag.stadt{background:var(--stadt)}
  .sheet .tag.essen{background:var(--essen)}
  .sheet .tag.kajak{background:var(--kajak)}
  .sheet .tag.wing{background:var(--wing)}
  .sheet .tag.surf{background:var(--surf)}
  .sheet .tag.wandern{background:var(--wandern)}
  .sheet .tag.sam{background:var(--sam)}
  .sheet .tag.tauch{background:var(--tauch)}
  .sheet .tag.velo{background:var(--velo)}
  .sheet .tag.info{background:var(--base)}
  .sheet h2{font-size:1.25rem;font-weight:800;line-height:1.25;margin-bottom:6px}
  .sheet .note{font-size:.92rem;line-height:1.55;color:#454c53}
  .sheet .note h3{font-size:.95rem;margin:14px 0 4px;color:var(--ink)}
  .sheet .note ul{padding-left:18px;margin:4px 0}
  .sheet .note li{margin-bottom:4px}
  .sheet .juli{
    font-size:.88rem;line-height:1.5;color:#1e4d22;
    background:#e9f3e6;border-radius:10px;
    padding:9px 12px;margin-top:10px;
  }
  .sheet .juli:empty{display:none}
  .sheet .warnbox{
    font-size:.85rem;line-height:1.5;color:#7a3c00;
    background:#fdf0dc;border:1px solid #eccb96;border-radius:10px;
    padding:9px 12px;margin-top:10px;
  }
  .sheet .warnbox:empty{display:none}
  .sheet .meta{font-size:.8rem;color:#79828a;margin-top:10px}
  .sheet a{color:var(--base)}
  .sheet a.route{
    display:inline-block;margin-top:14px;
    background:var(--base);color:#fff;text-decoration:none;
    font-size:.88rem;font-weight:700;
    padding:11px 18px;border-radius:12px;
  }
  .sheet a.route:active{background:var(--base-dark)}

  /* ---------- Zonen-Legende ---------- */
  .zone-legend{
    position:fixed;left:14px;bottom:calc(var(--sab) + 24px);z-index:22;
    background:#fff;border-radius:12px;box-shadow:var(--shadow);
    padding:10px 12px;font-size:.74rem;line-height:1.5;
  }
  .zone-legend label{display:flex;align-items:center;gap:6px;font-weight:700;cursor:pointer;margin-bottom:4px}
  .zl-row{display:flex;align-items:center;gap:6px;color:#454c53}
  .swatch{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
  .swatch.red{background:var(--zone-red);opacity:.55}
  .swatch.amber{background:var(--zone-amber);opacity:.55}

  /* ---------- Eigener Standort ---------- */
  .me-dot{
    width:18px;height:18px;border-radius:50%;
    background:#1a73e8;border:3px solid #fff;
    box-shadow:0 0 0 2px rgba(26,115,232,.35),0 2px 8px rgba(70,25,15,.3);
  }
  .locate-btn{
    position:fixed;right:14px;bottom:calc(var(--sab) + 24px);z-index:25;
    width:52px;height:52px;border-radius:50%;border:none;
    background:#fff;color:var(--base);font-size:22px;
    box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease;
  }
  .locate-btn:active{transform:scale(.92)}
  .locate-btn.active{background:var(--base);color:#fff}

  .leaflet-top{top:calc(var(--sat) + 118px)}
  .leaflet-control-attribution{font-size:9px}

  @media (min-width:760px){
    header{left:20px;right:auto;width:400px}
    .sheet{left:20px;right:auto;width:400px;border-radius:22px;bottom:20px;max-height:60vh}
    .zone-legend{left:auto;right:80px}
    .leaflet-top{top:20px}
    .leaflet-left{left:auto;right:10px}
  }
</style>
</head>
<body>

<div id="map"></div>

<header>
  <div class="title-card">
    <h1>Mexiko im Juli · Ideen-Karte</h1>
    <p>Nur Regionen &amp; Aktivitäten, die im Juli/Anfang August wirklich funktionieren</p>
    <button class="info-btn" id="infoBtn" aria-label="Juli-Logik und Quellen">ℹ️</button>
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-cat="all"><span class="dot"></span>Alle</button>
    <button class="chip" data-cat="must"><span class="dot"></span>⭐ Highlights</button>
    <button class="chip" data-cat="fest"><span class="dot"></span>🎉 Juli-Feste</button>
    <button class="chip" data-cat="tiere"><span class="dot"></span>🐋 Tiere</button>
    <button class="chip" data-cat="wasser"><span class="dot"></span>💧 Cenoten &amp; Baden</button>
    <button class="chip" data-cat="ruine"><span class="dot"></span>🏛️ Ruinen</button>
    <button class="chip" data-cat="stadt"><span class="dot"></span>🏘️ Städte</button>
    <button class="chip" data-cat="essen"><span class="dot"></span>🌮 Essen</button>
    <button class="chip" data-cat="kajak"><span class="dot"></span>🛶 Kajak</button>
    <button class="chip" data-cat="wing"><span class="dot"></span>🪁 Wingfoil</button>
    <button class="chip" data-cat="surf"><span class="dot"></span>🏄 Surfen</button>
    <button class="chip" data-cat="wandern"><span class="dot"></span>🥾 Wandern</button>
    <button class="chip" data-cat="tauch"><span class="dot"></span>🤿 Tauchen</button>
    <button class="chip" data-cat="velo"><span class="dot"></span>🚵 Velo &amp; MTB</button>
    <button class="chip" data-cat="sam"><span class="dot"></span>🌎 Südamerika</button>
  </div>
</header>

<div class="zone-legend" id="zoneLegend">
  <label><input type="checkbox" id="zoneToggle" checked> EDA-Risikozonen</label>
  <div class="zl-row"><span class="swatch red"></span> von Reisen abgeraten</div>
  <div class="zl-row"><span class="swatch amber"></span> erhöhte Vorsicht</div>
</div>

<button class="locate-btn" id="locateBtn" aria-label="Meinen Standort anzeigen" title="Mein Standort">➤</button>

<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <span class="tag" id="sheetTag"></span>
  <h2 id="sheetTitle"></h2>
  <p class="note" id="sheetNote"></p>
  <p class="juli" id="sheetJuli"></p>
  <p class="warnbox" id="sheetWarn"></p>
  <p class="meta" id="sheetMeta"></p>
  <a class="route" id="sheetRoute" target="_blank" rel="noopener">Route in Google Maps</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const CATS = {
  must:   {label:"Highlight",        emoji:"⭐"},

  tiere:  {label:"Tiere & Natur",    emoji:"🐋"},
  wasser: {label:"Cenoten & Baden",  emoji:"💧"},
  ruine:  {label:"Ruinen & Museen",  emoji:"🏛️"},
  stadt:  {label:"Städte & Dörfer",  emoji:"🏘️"},
  essen:  {label:"Essen & Märkte",   emoji:"🌮"},

  wing:   {label:"Wingfoil",         emoji:"🪁"},
  surf:   {label:"Surfen",           emoji:"🏄"},
  wandern:{label:"Wandern & Berge",  emoji:"🥾"},
  tauch:  {label:"Tauchen & Schnorcheln", emoji:"🤿"},
  velo:   {label:"Velo & MTB",       emoji:"🚵"},
  sam:    {label:"Südamerika-Idee",  emoji:"🌎"}
};

const PLACES = [
  // ================= Mexiko-Stadt & Umland (Hochland, Regenzeit = angenehm) =================

  {cat:"must", name:"Xochimilco", lat:19.2578, lng:-99.1039,
   note:"Bunte Trajinera-Boote durch die aztekischen Kanäle und Chinampas-Gärten, mit Mariachi- und Essensbooten - UNESCO-Welterbe.",
   juli:"Unter der Woche vormittags fahren: ruhig, grün und vor dem Regen zurück. Samstags wird es zur schwimmenden Party.",

  {cat:"essen", name:"Mercado de Coyoacán", lat:19.3562, lng:-99.1608,

  {cat:"essen", name:"Roma & Condesa", lat:19.4155, lng:-99.1710,

  {cat:"fest", name:"Lucha Libre in der Arena México", lat:19.4235, lng:-99.1531,

  {cat:"wasser", name:"Grutas de Tolantongo", lat:20.6458, lng:-99.0022,

  {cat:"stadt", name:"Puebla Centro", lat:19.0433, lng:-98.1981,

  {cat:"stadt", name:"Querétaro Centro", lat:20.5931, lng:-100.3920,

  {cat:"must", name:"Peña de Bernal", lat:20.7492, lng:-99.9496,

  {cat:"fest", name:"Vendimia: Weinlese-Feste Querétaro", lat:20.5698, lng:-99.8790,

  // ================= Oaxaca (Guelaguetza!) =================
  {cat:"fest", name:"Guelaguetza (letzte zwei Juli-Montage)", lat:17.0687, lng:-96.7312,
   note:"Das grösste Folklore-Fest Lateinamerikas: Delegationen aus allen Regionen Oaxacas tanzen im offenen Auditorium am Cerro del Fortín. Der ganze Juli ist in der Stadt Festmonat mit Umzügen (Convites), Mezcal-Messe und Konzerten.",
   juli:"2026: 20. + 27. Juli, je 10 und 17 Uhr - nach dem 27.7. sind die Lunes del Cerro VORBEI, Anfang August läuft nur noch die Nachfest-Stimmung. 2027: 19. + 26. Juli. Tickets für Bereich A/B früh sichern - die hinteren Ränge sind gratis, dafür sehr früh anstehen.",
   meta:"Auditorio Guelaguetza · Unterkünfte Monate im Voraus buchen"},
  {cat:"stadt", name:"Oaxaca Centro & Santo Domingo", lat:17.0654, lng:-96.7237,
   note:"Die schönste Kolonialstadt des Landes: Kirche Santo Domingo mit Goldinnerem, Kulturmuseum im Ex-Kloster, Läden mit Textilien und Alebrijes.",
   juli:"Im Juli ist die Stadt geschmückt und voller Musik - dafür Preise oben und Zimmer knapp. Tagsüber um 28 Grad, abends angenehm.",
   meta:"EDA: Stadt und Tal ok, abgelegenes Hinterland meiden"},
  {cat:"ruine", name:"Monte Albán", lat:17.0439, lng:-96.7674,
   note:"Zapoteken-Hauptstadt auf einem abgeflachten Bergrücken über dem Tal - Plattformen, Ballspielplatz, 360-Grad-Blick.",
   juli:"Morgens fahren: klare Sicht auf die grünen Täler, bevor Mittagshitze und Quellwolken kommen. Kaum Schatten oben.",
   meta:"Täglich 8-16.30 Uhr · Shuttle ab Zentrum"},
  {cat:"wasser", name:"Hierve el Agua", lat:16.8659, lng:-96.2760,
   note:"Versteinerte „Wasserfälle“ aus Kalk und mineralische Infinity-Becken mit Blick über die Sierra.",
   juli:"In der Regenzeit sind die Becken gefüllt und die Täler grün - fotogenste Zeit. Am besten als Tour mit Mezcal- und Teotitlán-Stopp.",
   warn:"Zugang wird von der Gemeinde verwaltet und ist gelegentlich gesperrt - Stand vor Ort erfragen.",
   meta:"1.5 Std. ab Oaxaca, letzter Abschnitt Piste"},
  {cat:"essen", name:"Mercado 20 de Noviembre", lat:17.0598, lng:-96.7264,
   note:"Oaxacas Fress-Markt: im „Pasillo de Humo“ wählt man rohes Fleisch und grillt es am Stand, dazu Tlayudas, Mole und heisse Schokolade.",
   juli:"Rund um die Guelaguetza brummt der Markt - mittags hingehen, abends sind die besten Stände leer gekauft.",
   meta:"Täglich bis ca. 20 Uhr"},
  {cat:"essen", name:"Mezcal-Dörfer um Santiago Matatlán", lat:16.8664, lng:-96.3810,
   note:"Die „Welthauptstadt des Mezcal“: Palenques zeigen Ernte, Erdofen und Destillation, mit Verkostung direkt beim Produzenten. Im Juli läuft in der Stadt parallel die grosse Mezcal-Messe (Feria del Mezcal).",
   juli:"Feria del Mezcal in Oaxaca-Stadt während der Guelaguetza-Wochen - probieren dort, kaufen im Dorf.",
   warn:"EDA warnt vor abgelegenen Strassen im Hinterland - mit Tour oder Fahrer fahren, nicht nachts.",
   meta:"Tagesausflug, oft mit Hierve el Agua kombiniert"},
  {cat:"stadt", name:"Teotitlán del Valle", lat:17.0300, lng:-96.5220,
   note:"Weberdorf der Zapoteken: Teppiche mit Naturfarben aus Cochenille, Indigo und Granatapfel, Werkstattbesuche bei Familien.",
   juli:"Gut mit Markt am Sonntag in Tlacolula kombinierbar - im Festmonat besonders lebhaft.",
   meta:"40 Min. ab Oaxaca"},

  // ================= Oaxaca-Küste (Regenzeit-Spezialitäten) =================
  {cat:"must", name:"Puerto Escondido", lat:15.8530, lng:-97.0480,
   note:"Surfstadt mit Weltklasse-Welle: an der Playa Zicatela laufen im Juli die grossen Süd-Swells (zuschauen!), gebadet wird in der geschützten Bucht Carrizalillo.",
   juli:"Juli = Big-Wave-Saison an der Zicatela, morgens oft sonnig, abends Schauer. Schwül, aber deutlich ruhiger als im Winter.",
   warn:"Anreise ab Oaxaca-Stadt am besten per Flug (40 Min.) - EDA rät von abgelegenen Überlandstrassen ab, die Serpentinen-Route dauert 7+ Std.",
   meta:"Flug OAX-PXM oder via CDMX"},
  {cat:"tiere", name:"Biolumineszenz: Laguna de Manialtepec", lat:15.9269, lng:-97.2115,
   note:"Nachts leuchtet das Wasser bei jeder Bewegung blau - Plankton-Biolumineszenz zum Reinschwimmen.",
   juli:"Die Regenzeit ist die beste Saison dafür: Süsswasserzufluss füttert das Plankton. Um Neumond buchen, bei Vollmond sieht man wenig.",
   meta:"Abendtouren ab Puerto Escondido, ca. 20 Min. Fahrt"},

  // ================= Chiapas (Hochland kühl, Wasserfälle voll) =================
  {cat:"stadt", name:"San Cristóbal de las Casas", lat:16.7370, lng:-92.6376,
   note:"Koloniales Hochlandstädtchen auf 2200 m: Märkte der Tzotzil-Gemeinden, Kaffeehäuser, Amber-Museum, kühle Bergluft.",
   juli:"Im Juli tagsüber um 20 Grad - nach der Yucatán-Hitze eine Erholung. Abends Jacke, nachts frisch.",
   meta:"Flug nach Tuxtla (TGZ), dann 1 Std. Berg hoch"},
  {cat:"must", name:"Cañón del Sumidero", lat:16.7078, lng:-93.0117,
   note:"Bootsfahrt zwischen 1000-Meter-Wänden: Krokodile, Brüllaffen, Pelikane und der „Weihnachtsbaum“-Wasserfall.",
   juli:"In der Regenzeit führt der Fluss viel Wasser und die Wände sind grün bewachsen - beste Zeit für die Tour. Morgens fahren (ruhigeres Wasser).",
   meta:"Boote ab Chiapa de Corzo, ca. 2 Std."},
  {cat:"wasser", name:"Cascadas El Chiflón", lat:16.0064, lng:-92.2666,
   note:"Türkise Kaskaden-Treppe mit dem 120-m-Fall „Velo de Novia“, gut ausgebauter Weg bergauf entlang der Fälle.",
   juli:"Regenzeit = maximale Wassermassen, spektakulär (und Gischt-Dusche). Nach Starkregen kann das Türkis 1-2 Tage eintrüben - dann trotzdem beeindruckend.",
   meta:"Tagesausflug ab San Cristóbal, oft mit Montebello"},
  {cat:"wasser", name:"Lagos de Montebello", lat:16.1000, lng:-91.7000,
   note:"Dutzende Seen in Kiefernwald an der Grenze zu Guatemala, jeder in anderem Blau-Grün - mit Floss oder Kajak auf einzelnen Seen.",
   juli:"Farben je nach Licht: Vormittag einplanen, bevor die Wolken kommen.",
   warn:"Nur die touristische Seen-Route nutzen; das eigentliche Grenzgebiet zu Guatemala stuft das EDA als gefährlich ein.",
   meta:"1.5 Std. ab Comitán"},
  {cat:"stadt", name:"San Juan Chamula", lat:16.7900, lng:-92.6880,
   note:"Tzotzil-Dorf mit der berühmten Kirche voller Kiefernnadeln, Kerzenmeer und Schamanen-Ritualen - einer der eindrücklichsten Orte des Landes.",
   juli:"Sonntags ist Markt und am meisten los. In der Kirche gilt absolutes Fotoverbot - wird sehr ernst genommen.",
   meta:"20 Min. ab San Cristóbal, mit lokalem Guide sinnvoll"},
  {cat:"ruine", name:"Palenque", lat:17.4839, lng:-92.0460,
   note:"Maya-Ruinen im Nebel-Dschungel mit dem Grab von Pakal - im Juli dampft der Urwald und die Brüllaffen sind laut.",
   juli:"Früh um 8 Uhr rein: kühler, leerer, Tierstimmen. Nachmittags tropische Güsse. Agua Azul ist in der Regenzeit oft braun statt türkis - Erwartung anpassen (El Chiflón ist die bessere Regenzeit-Alternative).",
   warn:"EDA: Auf der Strasse 199 San Cristóbal-Palenque errichten kriminelle Gruppen Blockaden. Stattdessen fliegen (Villahermosa/Palenque) oder Grossbus-Verbindung mit Tag-Ankunft wählen.",
   meta:"Site täglich 8-17 Uhr"},

  // ================= Yucatán & Campeche (heiss, aber Cenoten-Strategie) =================
  {cat:"must", name:"Mérida", lat:20.9674, lng:-89.6237,
   note:"Sicherste Grossstadt Mexikos, Basis für Cenoten, Uxmal und die Nordküste: Paseo Montejo, Kolonialpaläste, starke Küche (Cochinita Pibil).",
   juli:"Sehr heiss (35-38 Grad) - Stadtleben findet abends statt: montags Vaquería, sonntags autofreier Biciruta-Morgen. Mittags Museum oder Pool.",
   meta:"Bundesstaat Yucatán taucht in keiner EDA-Warnliste auf"},
  {cat:"ruine", name:"Uxmal", lat:20.3597, lng:-89.7713,
   note:"Puuc-Architektur mit der ovalen Zauberer-Pyramide - für viele die schönste Maya-Stätte, mit einem Bruchteil der Chichén-Massen.",
   juli:"8-Uhr-Einlass nutzen, um 11 ist die Hitze brutal. Wasser mitnehmen, es gibt kaum Schatten.",
   meta:"1 Std. ab Mérida · Choco-Story nebenan"},
  {cat:"must", name:"Chichén Itzá", lat:20.6843, lng:-88.5678,
   note:"El Castillo, Ballspielplatz, Cenote Sagrado - Weltwunder und entsprechend voll.",
   juli:"Nur mit 8-Uhr-Strategie sinnvoll: erste Stunde fast leer, ab 10.30 Busmassen aus Cancún plus 38-Grad-Hitze. Danach in eine Cenote abtauchen.",
   warn:"Juli ist mexikanische Ferienzeit - Wochenende und Sonntag (Gratis-Eintritt für Mexikaner) meiden.",
   meta:"Übernachtung in Valladolid statt Tagestour ab Küste"},
  {cat:"stadt", name:"Valladolid", lat:20.6896, lng:-88.2011,
   note:"Pastellfarbene Kolonialstadt auf halbem Weg zwischen Mérida und der Küste - ideale Cenoten-Basis mit kühlen Innenhöfen.",
   juli:"Nachmittags Siesta wie die Einheimischen, abends auf die Plaza (Marquesitas probieren).",
   meta:"Calzada de los Frailes für den Sonnenuntergang"},
  {cat:"wasser", name:"Cenoten-Ring um Valladolid", lat:20.7075, lng:-88.1476,
   note:"Oxman (Lianen-Sprung), Suytun (Lichtstrahl-Plattform), X'canché bei Ek Balam - unterirdische Süsswasser-Pools, konstant 25 Grad.",
   juli:"Der Juli-Hack schlechthin: Mittagshitze unter der Erde überbrücken. Suytun-Lichtstrahl steht um die Mittagszeit am besten.",
   meta:"Per Velo, Taxi oder Colectivo ab Valladolid"},
  {cat:"wasser", name:"Cenotes Santa Bárbara (Homún)", lat:20.7333, lng:-89.2833,
   note:"Drei sehr verschiedene Cenoten auf einem Gelände, per Velo oder Pferdebahn verbunden - Homúns Cenoten-Cluster ist der beste ab Mérida.",
   juli:"Unter der Woche fast privat; am Wochenende kommen die Familien aus Mérida.",
   meta:"1 Std. ab Mérida · Bargeld"},
  {cat:"stadt", name:"Izamal", lat:20.9330, lng:-89.0180,
   note:"Die komplett gelbe Stadt: Franziskanerkloster auf einer Maya-Plattform, Kutschen, Handwerk.",
   juli:"Halbtagesstopp zwischen Mérida und Valladolid - morgens, das Gelb glüht in der Sonne.",
   meta:"Kloster täglich, gratis"},
  {cat:"ruine", name:"Ek Balam", lat:20.8917, lng:-88.1360,
   note:"Noch besteigbare Akropolis mit perfekt erhaltenem Stuck-Monsterportal - danach Abkühlung in der Cenote X'canché direkt am Gelände.",
   juli:"Kombination Ruine (früh) + Cenote (mittags) ist im Juli genau richtig.",
   meta:"30 Min. ab Valladolid"},
  {cat:"tiere", name:"Río Lagartos: Flamingo-Kolonie", lat:21.5970, lng:-88.1590,
   note:"Biosphärenreservat mit der grossen Flamingo-Brutkolonie Mexikos, dazu Krokodile, Pelikane, Fregattvögel auf der Bootstour.",
   juli:"Genau jetzt richtig: Juli = Küken-Zeit, die Jungen machen erste Flugversuche. (Celestún dagegen ist die Winter-Kolonie - im Juli fast leer.) Guides halten Brutschutz-Abstände ein.",
   meta:"Bootstouren ab Malecón, ca. 2-3 Std."},
  {cat:"tiere", name:"Las Coloradas: pinke Salinen", lat:21.6089, lng:-87.9856,
   note:"Knallpinke Salzseen neben weissen Salzbergen - meist als Kombi mit der Río-Lagartos-Bootstour.",
   juli:"Farbe ist bei hoher Verdunstung (Sonne mittags) am kräftigsten. Baden verboten, Drohnen nur mit Bewilligung.",
   meta:"Nur mit offiziellem Guide ans Ufer"},
  {cat:"stadt", name:"Campeche", lat:19.8454, lng:-90.5237,
   note:"UNESCO-Festungsstadt in Bonbonfarben am Golf, fast ohne Auslandstourismus - Abendessen auf der Calle 59, Malecón-Sonnenuntergang.",
   juli:"Ruhigste sichere Ecke der Halbinsel, gleiches Klima wie Mérida: Programm morgens/abends.",
   meta:"2.5 Std. ab Mérida · Velo-Verleih am Malecón (GoBoard, ~200 MXN/Std.)"},
  {cat:"ruine", name:"Edzná", lat:19.5969, lng:-90.2273,
   note:"Fünfstöckiger Palast-Tempel, Wasserbau-System - und oft hat man die Anlage komplett für sich.",
   juli:"Der Geheimtipp gegen Chichén-Massen: auch um 10 Uhr noch fast leer.",
   meta:"1 Std. ab Campeche"},

  // ================= Quintana Roo (Walhai-Peak, Sargassum-Ehrlichkeit) =================
  {cat:"tiere", name:"Walhai-Schnorcheln ab Isla Mujeres", lat:21.2311, lng:-86.7343,
   note:"Vor der Küste sammelt sich im Sommer die grösste Walhai-Ansammlung der Welt („Afuera“-Zone Richtung Isla Contoy) - schnorcheln neben 8-Meter-Fischen.",
   juli:"DER Grund für Mexiko im Juli: Saison 15. Mai bis 17. September, Peak Juli/August mit den grössten Gruppen. Touren für Juli Wochen im Voraus buchen, kleine Boote wählen.",
   meta:"Ca. 6 Uhr Abfahrt · Seekrankheits-Tablette",
   warn:"EDA stuft Quintana Roo mit erhöhter Vorsicht ein - gilt v. a. für Nachtleben/Cancún-Stadt, nicht für die Bootstouren."},
  {cat:"wasser", name:"Playa Norte (Isla Mujeres)", lat:21.2622, lng:-86.7521,
   note:"Flacher, türkiser Karibikstrand an der Nordspitze der Insel - per Golfcart erkundbar, abends ruhig.",
   juli:"Die verlässlichste sargassumfreie Bade-Option der Karibikküste: Lage nach Nordwesten schützt - im Juli 2026 laut Sargassum-Trackern „clear“, während Tulum voll liegt.",
   meta:"Fähre ab Cancún 20 Min."},
  {cat:"tiere", name:"Isla Holbox", lat:21.5218, lng:-87.3767,
   note:"Autofreie Golf-Insel: Sandstrassen, Hängematten im Wasser, Walhai-Touren und nachts Biolumineszenz am Punta-Cocos-Strand.",
   juli:"Doppel-Kombo im Juli: Walhai-Peak plus Leucht-Plankton (Juni-Sept., um Neumond am stärksten). Golfseite = kaum Sargassum.",
   warn:"Regenzeit-Realität: Nach Güssen stehen die Sandstrassen unter Wasser, Mücken einplanen. Wenige Bankomaten - Bargeld mitnehmen.",
   meta:"Fähre ab Chiquilá · Juli-Touren vorbuchen"},
  {cat:"wasser", name:"Ruta de los Cenotes (Puerto Morelos)", lat:20.8100, lng:-86.9600,
   note:"Cenoten-Strasse in den Dschungel: Verde Lucero, La Noria, Siete Bocas - offene und Höhlen-Cenoten weit weg vom Resort-Trubel.",
   juli:"Wenn der Strand Sargassum hat, ist das hier der Plan B - glasklares Süsswasser, egal was das Meer macht. Puerto Morelos selbst lag zuletzt nur bei „light“.",
   meta:"Mietauto oder Taxi ab Puerto Morelos"},
  {cat:"tauch", name:"Cozumel: Westriffe", lat:20.3800, lng:-87.0300,
   note:"Palancar, Columbia, Chankanaab: Drift-Tauchen und Schnorcheln am Arrecifes-Nationalpark - ein Weltklasse-Revier, von dem schon Cousteau schwärmte. Etablierte Basen wie Aldora Divers oder ScubaTony, Schnorchel-Highlight Punta Sur Eco Beach Park. An der Ostküste nicht baden - Strömung.",
   juli:"28-Grad-Wasser, gute Sicht, und die Leeseite bleibt weitgehend sargassumfrei - Juli ist solide Tauchzeit (Hurrikan-Forecast checken).",
   meta:"Fähre ab Playa del Carmen"},
  {cat:"ruine", name:"Tulum-Ruinen", lat:20.2140, lng:-87.4290,
   note:"Maya-Burg über der Karibik - als Foto-Klassiker weiterhin stark, als Badeort im Juli ehrlich gesagt schwach.",
   juli:"Nur früh um 8 Uhr für die Ruinen kommen. Baden: Die Tulum-Strände fangen im Sommer 2026 die schwersten Sargassum-Mengen der Küste - stattdessen Gran Cenote/Calavera oder gleich Isla Mujeres.",
   warn:"EDA erwähnt Tulum explizit (Schiesserei-Vorfall) - Nachtleben meiden, tagsüber unproblematisch.",
   meta:"Parkplatz teuer, Colectivo ab Tulum Pueblo"},
  {cat:"wasser", name:"Laguna Bacalar", lat:18.6770, lng:-88.3900,
   note:"Die „Lagune der sieben Farben“: 40 km Süsswasser über weissem Kalkgrund, Stromatolithen, Segeln und SUP - kein Sargassum, weil keine Meeresküste.",
   juli:"Funktioniert im Juli gut, mit einer Einschränkung: Nach mehrtägigem Starkregen kann die Lagune vorübergehend eintrüben. Morgens sind die Farben am stärksten.",
   warn:"Ganz im Süden von Quintana Roo (EDA-Vorsicht, Nähe Chetumal) - tagsüber reisen.",
   meta:"3.5 Std. ab Tulum, Übernachtung einplanen"},

  // ================= Kajak & Paddeln (CDMX-Spots aus der Mexico-City-Karte importiert) =================
  {cat:"kajak", name:"Embarcadero Cuemanco (Xochimilco)", lat:19.289158, lng:-99.101753,
   note:"Der ruhige Zugang nach Xochimilco: Kajak- und Kanuverleih abseits des Trajinera-Trubels, durch stille Kanäle zwischen Chinampa-Feldern - Reiher und Eisvögel inklusive. Gleich nebenan die schnurgerade Olympia-Regattastrecke von 1968 (Pista Virgilio Uribe).",
   juli:"Morgens paddeln: Kanäle voll Wasser und alles grün, das Gewitter kommt erst am Nachmittag. Auch bei grauem Regenzeit-Himmel gut - die Kanäle sind geschützt.",
   warn:"Vormittags im belebten Hauptrevier bleiben - einsame Ecken der Regattastrecke und Abendstunden meiden (ältere Sicherheitsberichte zur Pista). Boote sind Freizeit-Sit-on-Tops, keine Tourenkajaks.",
   meta:"Ruta del Ajolote: Tour ab ~300 MXN, mit Chinampa-Frühstück 450, ab 6 Uhr (auch Ajolotario) · Kayak 33 Komplett-Tour ~750 MXN · Verleih am Michmani-Gelände 8-17 Uhr"},
  {cat:"kajak", name:"Lago de Chapultepec: Stadt-Kajak", lat:19.4140, lng:-99.1990,
   note:"Die Spontan-Variante mitten in der Stadt: Kajak-Verleih am Lago Mayor der 2. Chapultepec-Sektion - 40 MXN/Std. (Einer), 60 MXN (Zweier), einfach hinlaufen, Ausweis als Pfand.",
   juli:"Ideal für durchzogene Regenzeit-Tage: kein Commitment, und bei Platzregen bist du in 5 Minuten im Trockenen.",
   meta:"Di-So 9-16.30 Uhr · Puerto Chico/Puerto Grande"},
  {cat:"kajak", name:"Isla de las Muñecas (per Kajak)", lat:19.272245, lng:-99.088708,
   note:"Die berüchtigte Puppeninsel tief in den Kanälen: hunderte verwitterte Puppen, die der Einsiedler Don Julián über Jahrzehnte aufhängte. Nur per Boot oder Kajak erreichbar.",
   juli:"Gut 2 Stunden ab Cuemanco - früh los, damit der Rückweg vor dem Nachmittagsregen liegt.",
   meta:"Lange Tour, beim Verleih anmelden"},
  {cat:"kajak", name:"Parque Ecológico de Xochimilco", lat:19.293688, lng:-99.096242,
   note:"Feuchtgebiet-Schutzzone mit Lagunen und Vogelbeobachtung, hier laufen die Zuchtprojekte für den Axolotl - der stille Gegenpol zum Partyteil von Xochimilco.",
   juli:"Regenzeit heisst Wasserstand und Vogelleben auf Maximum.",
   meta:"Periférico Sur · Eintritt günstig"},
  {cat:"kajak", name:"Valle de Bravo", lat:19.201123, lng:-100.131536,
   note:"Bergsee-Städtchen und CDMX-Wochenendziel: Kajak, SUP und Segeln auf dem Stausee, drumherum Pinienwälder, Gleitschirme und die Wanderung zur La-Peña-Aussicht.",
   juli:"Regenzeit füllt den See und färbt die Hügel grün - vormittags ist das Wasser am ruhigsten. Wochenenden sind voll, unter der Woche fast privat.",
   meta:"Gut 2 Std. westlich von CDMX · Pueblo Mágico"},
  {cat:"kajak", name:"Bacalar per Kajak & Los Rápidos", lat:18.6795, lng:-88.3888,
   note:"Die Lagune der sieben Farben vom Wasser aus: Sonnenaufgangs-Kajaktouren ab dem Ort, dazu Los Rápidos 15 km südlich - ein schmaler Kanal mit sanfter Strömung zwischen Stromatolithen.",
   juli:"Um 6.30 Uhr ist die Lagune spiegelglatt und leer - vor Hitze und Wind. Stromatolithen nie berühren oder betreten.",
   warn:"Ganz im Süden von Quintana Roo (EDA-Vorsicht) - tagsüber reisen.",
   meta:"Mehrere Verleiher am Malecón"},
  {cat:"kajak", name:"Holbox: Mangroven-Kajak", lat:21.5310, lng:-87.3600,
   note:"Geführte Kajaktouren durch die Mangrovenkanäle der Yum-Balam-Schutzzone: Sonnenaufgang mit Vögeln - oder nachts im leuchtenden Plankton paddeln.",
   juli:"Kombinierbar mit dem Walhai-Peak; die Nacht-Tour wirkt um Neumond am stärksten.",
   meta:"Ab Holbox-Dorf, ca. 2-3 Std."},

  // ================= Wingfoil =================
  {cat:"wing", name:"El Cuyo: Wingfoil-Flachwasser", lat:21.5162, lng:-87.6778,
   note:"Kilometerlanges stehtiefes Flachwasser am Golf, Sandboden, viel Platz und ein kleines Kite-/Wing-Dorf ohne Trubel - mit Schulen und Materialverleih.",
   juli:"Saison läuft Nov.-Juli: im Juli weht der Passat leichter (oft 12-18 Knoten nachmittags) - genau das Foil-Fenster. ACHTUNG fürs Fenster Ende Juli/Anfang August: Ab August flaut es bis Oktober ab - Ende Juli ist die letzte verlässliche Woche, danach ist Calima oder Jeri die bessere Wing-Wahl.",
   meta:"2.5 Std. ab Valladolid oder Mérida · Wing-Kurse buchbar"},
  {cat:"wing", name:"Isla Blanca: Lern-Lagune (Cancún)", lat:21.3744, lng:-86.7929,
   note:"Riesige stehtiefe Lagune auf der Sandzunge nördlich von Cancún - der bekannteste Flachwasser-Lernspot der Karibikküste, Schulen ganzjährig.",
   juli:"Ausserhalb der Kernsaison (Nov.-Juni): Wind unbeständiger, Sessions eher früh oder mit der Nachmittags-Seebrise - für Foil-Übungsschläge reicht es oft trotzdem.",
   warn:"Im Juli keine Wind-Garantie - als Kombi mit Walhai/Isla Mujeres planen, nicht als Hauptziel.",
   meta:"30 Min. ab Cancún, sandige Zufahrt · Schulen: Icarus Kite Centre, Kitesurf Mexico"},

  // ================= Surfen (Juli = Süd-Swell-Saison am Pazifik) =================
  {cat:"surf", name:"La Punta (Zicatela-Südende)", lat:15.8375, lng:-97.0340,
   note:"Die entspannte Schwester der grossen Zicatela: Point Break mit langen Linkswellen, Surfschulen, Strandbars und Backpacker-Szene im Viertel Brisas de Zicatela.",
   juli:"Sehr konstante Wellen (Süd-Swell-Saison) - an grossen Tagen auch hier kräftig, dann früh morgens gehen oder nach Carrizalillo ausweichen.",
   meta:"Boards und Kurse direkt am Strand, z. B. Puerto Surf (Einzel- und Gruppenstunden)"},
  {cat:"surf", name:"Playa Carrizalillo (Anfänger-Bucht)", lat:15.8596, lng:-97.0785,
   note:"Geschützte Bucht mit sanft brechender Welle - der klassische Lernspot von Puerto Escondido, Zugang über die lange Treppe.",
   juli:"Auch in der grossen Swell-Saison meist gutmütig: Surfkurse starten morgens um 9 Uhr, danach Badebucht.",
   meta:"Kurse ca. 2.5 Std., Board inklusive"},
  {cat:"surf", name:"Barra de la Cruz", lat:15.8397, lng:-95.9706,
   note:"Weltklasse-Rechtswelle östlich von Huatulco, von der Dorfgemeinschaft verwaltet: Eintritt, Palapa mit Essen, keine Hotels am Strand.",
   juli:"Genau die Saison: Die Welle lebt von Süd-Swells (ca. April-Sept.) und läuft im Juli am zuverlässigsten. Für Fortgeschrittene.",
   warn:"Anfahrt via Küstenstrasse 200 tagsüber - EDA rät von abgelegenen Strassen nach Einbruch der Dunkelheit ab.",
   meta:"45 Min. ab Huatulco · Bargeld für den Community-Eintritt"},
  {cat:"surf", name:"Chacahua: Surf-Camp im Nationalpark", lat:16.0019, lng:-97.7200,
   note:"Lagunen, Mangroven und ein Fischerdorf mit sandigem Beach Break - Surf-Camps, Hängematten, kaum Strom-Luxus. Nachts leuchtet auch hier das Plankton.",
   juli:"Regenzeit = grüne Lagunen und leere Line-ups; die Welle ist gutmütiger als Zicatela. Biolumineszenz um Neumond.",
   warn:"Abgelegen, nur per Boot/Piste erreichbar - einfache Unterkünfte, Bargeld und Mückenschutz mitnehmen.",
   meta:"Ab Puerto Escondido: Colectivo + Boot ab El Zapotalito, ca. 2 Std."},

  // ================= Wandern & Berge (Hochland: früh starten, Gewitter ab Mittag) =================
  {cat:"wandern", name:"Nevado de Toluca: Kraterseen", lat:19.1079, lng:-99.7555,
   note:"Erloschener 4680-m-Vulkan mit zwei Kraterseen (Sonne und Mond). Vom Parkplatz zum Kraterrand und zu den Seen sind es je nach Route 1-3 Std. - Höhenluft garantiert.",
   juli:"Falls wieder offen, gilt: nur mit Frühstart - vormittags oft klar, ab Mittag Wolken, Graupel und Blitze. Warm anziehen (oben um 5 Grad) und vorher 1-2 Tage in CDMX akklimatisieren.",
   warn:"GESPERRT (Stand Juli 2026): Zugang seit dem Unfall vom 10.8.2025 zu, CONANP büsst nicht autorisierte Aufstiege. Geplantes neues Modell: nur zu Fuss ab Parque de los Venados, Di-So 8-15 Uhr - Termin unbestätigt. Vor Anreise Status bei CONANP prüfen; Alternative: La Malinche.",
   meta:"Status: gob.mx/conanp · bis zur Öffnung NICHT hinfahren"},
  {cat:"wandern", name:"Iztaccíhuatl ab Paso de Cortés", lat:19.0864, lng:-98.6468,
   note:"Der Sattel zwischen Popocatépetl und Iztaccíhuatl: Tageswanderungen ab La Joya Richtung Refugio (bis ca. 4700 m) mit Blick auf den rauchenden Popo - der selbst gesperrt ist.",
   juli:"4-Uhr-Start ist Pflicht, Gewitter am Berg ab frühem Nachmittag. Registrierung am Parkeingang, Guide für alles oberhalb der Refugio-Route.",
   warn:"Unter der Woche ist der Berg einsam - dann mit Guide oder Begleitung gehen. Am La-Joya-Parkplatz sind Autoaufbrüche dokumentiert: nichts im Auto lassen, besser mit Fahrer/Tour statt Mietauto über Nacht.",
   meta:"Zufahrt via Amecameca · Checkpoint + Parkgebühr am Paso de Cortés"},
  {cat:"wandern", name:"Ajusco: Pico del Águila (CDMX)", lat:19.2210, lng:-99.2560,
   note:"Der Hausberg von Mexiko-Stadt: vom Stadtrand auf 3930 m, mit Blick über das ganze Tal - machbar als halber Tag mit Uber-Anreise. Rundweg ab Albergue Alpino über Pico del Águila (3880 m) und Cruz del Marqués (3930 m), ~6.8 km, letzte 200 m einfache Kraxelei.",
   juli:"Beliebte Akklimatisierungs-Tour vor Toluca oder Izta. Am Sonntagvormittag im Strom der Gruppen gehen (Start ~8 Uhr mit den ersten Familien, nicht allein vorweg); Wege nach Regen rutschig, Offline-Track laden (Empfang lückig).",
   warn:"Lokale Medien meldeten 2025 Überfälle auf Wanderer und Biker im Ajusco-Gebiet (Ziel: Ausrüstung) - nur die belebte Hauptroute am Wochenende, keine einsamen Varianten oder Solo-Frühstarts; Alternative: geführte Gruppe ab CDMX. Wertsachen minimal, nichts sichtbar im Auto.",
   meta:"Start „Albergue Alpino Ajusco“ oder „El Abrevadero“ (Uber ~250-350 MXN)"},
  {cat:"wandern", name:"La Malinche (4460 m)", lat:19.2322, lng:-98.0442,
   note:"Der gutmütigste hohe Gipfel Mexikos: langer, technisch einfacher Anstieg durch Kiefernwald bis zum felsigen Gipfelgrat - perfekter erster 4000er.",
   juli:"Start vor Sonnenaufgang am Centro Vacacional, Gipfel vor Mittag, runter vor dem Gewitter. Die Regenzeit ist zudem Pilz-Monat in den Wäldern. Auch unter der Woche der entspannteste der hohen Berge: Basis ist der bewachte IMSS-Ferienkomplex (24-h-Sicherheit), Tlaxcala gehört zu den ruhigsten Bundesstaaten.",
   meta:"Basis Centro Vacacional Malintzi · ab Puebla 1 Std."},
  {cat:"wandern", name:"Pueblos Mancomunados (Sierra Norte)", lat:17.1189, lng:-96.4525,
   note:"Acht Zapoteken-Bergdörfer (u. a. Cuajimoloyas, Latuvi, Benito Juárez) mit gemeinschaftlich betriebenem Wandernetz: Dorf-zu-Dorf-Etappen durch Nebelwald, einfache Hütten und lokale Guides. Die Routen sind auch als MTB-Touren fahrbar (Guides/Bikes ab Oaxaca-Stadt).",
   juli:"Regenzeit heisst hier Wolkenwald in Bestform, Pilze und grüne Wiesen - Regenjacke einpacken, Nächte auf 3000 m kalt. Die Guide-Struktur macht die Region auch nach EDA-Massstab gut machbar.",
   meta:"Buchung via Expediciones Sierra Norte in Oaxaca-Stadt"},

  // ================= Tauchen & Schnorcheln =================
  {cat:"tauch", name:"Parque Dos Ojos: Cavern-Tauchen", lat:20.3247, lng:-87.3906,
   note:"Das berühmteste Cenoten-Höhlensystem der Riviera Maya: geführte Schnorcheltouren durch die Kavernen für alle, Cavern-Dives mit Tulumer Basen wie La Calypso oder Flying Fish für Brevetierte - Stalaktiten, Lichtkegel, glasklares Süsswasser.",
   juli:"Der wetterfeste Juli-Trumpf: 25 Grad Wasser, egal ob draussen Hitze, Regen oder Sargassum herrscht. Früh kommen, ab Mittag Tour-Gruppen.",
   meta:"Zwischen Tulum und Akumal · Gran Cenote und Zacil-Há gleich daneben"},
  {cat:"tauch", name:"Banco Chinchorro ab Mahahual", lat:18.7257, lng:-87.7072,
   note:"Das zweitgrösste Atoll-Riff der Welt, Biosphärenreservat mit Schiffswracks, Riffhaien und intakten Korallen - Tagesausflüge ab dem entspannten Strandort Mahahual (lokale Basen wie Doctor Dive).",
   juli:"Sommer = beste Chancen auf die ruhige See, die die 2-Stunden-Überfahrt braucht (wetterabhängig, Puffertag einplanen).",
   warn:"Ganz im Süden von Quintana Roo (EDA-Vorsicht) und abgelegen - Anreise tagsüber, NHC-Wetterlage checken.",
   meta:"100 km östlich von Bacalar · gut kombinierbar"},
  {cat:"tauch", name:"Bahías de Huatulco: Buchten & Riffe", lat:15.7692, lng:-96.1355,
   note:"Neun Buchten im Nationalpark (119 km² geschützt): Tauchen mit dem Huatulco Dive Center (PADI), Schnorchel-Ausflüge mit Hurricane Divers, dazu die Seven-Bays-Bootstour der lokalen Kooperative Huatulco Salvaje. Kurze Küsten-Wanderungen zur Bahía El Órgano und zur Cascada Arcoíris.",
   juli:"Pazifik-Vorteil: kein Sargassum. Regenzeit-Rhythmus wie an der ganzen Küste - Wasserprogramm morgens, Schauer am Abend.",
   meta:"Flug via CDMX oder Oaxaca (HUX) · Basis La Crucecita"},

  // ================= Velo & MTB =================
  {cat:"velo", name:"Cobá: Ruinen per Velo", lat:20.4936, lng:-87.7354,
   note:"Die Dschungel-Ruinenstadt mit der höchsten Pyramide Quintana Roos erkundet man am besten per Mietvelo - der Verleih steht gleich hinter dem Eingang, die Pisten führen kilometerweit unter Baumdächern zu den Tempelgruppen.",
   juli:"Um 8 Uhr rein: schattig-kühl und fast leer, während Chichén schon voll ist. Danach in die Cenoten Choo-Ha und Multum-Ha abtauchen.",
   meta:"1 Std. ab Tulum oder Valladolid"},
  {cat:"velo", name:"Valladolid: Cenoten-Velotour", lat:20.6850, lng:-88.2110,
   note:"Bike Tour Valladolid fährt ganztägige Runden zu Cenoten und Dörfern (ca. 650 MXN, Buchung per WhatsApp), Vallarent vermietet Velos für die eigene Cenoten-Runde - die flache Umgebung ist ideales Veloterrain.",
   juli:"Früh starten, die Cenoten-Stopps sind die eingebaute Abkühlung mittags.",
   meta:"Verleih wenige Blocks westlich vom Parque Principal"},
  {cat:"velo", name:"Oaxaca: MTB mit Pedro Martínez", lat:17.0625, lng:-96.7175,
   note:"Bicicletas Pedro Martínez - der Shop des Olympia-Medaillengewinners - fährt MTB-Touren durch den ganzen Bundesstaat, inklusive Mehrtagestrips in die Sierra Norte. Abends: die gratis Paseos Nocturnos von Mundo Ceiba, eine 8-km-Nachtausfahrt durchs Zentrum (Velo-Miete ~150 MXN).",
   juli:"Hochland-Regenzeit: Trails vormittags fahren, die Nachtausfahrt läuft nach dem Abendgewitter.",
   meta:"Beide im Zentrum von Oaxaca-Stadt"},
  {cat:"velo", name:"Querétaro: Wein & Käse per Velo", lat:20.5205, lng:-99.8940,
   note:"Bike Tour Querétaro (ab 2 Personen, ~1700 MXN) radelt zu Weingütern und Käsereien rund um Tequisquiapan und Bernal - inklusive Degustationen und auf Wunsch einer Opal-Minen-Tour.",
   juli:"Passt perfekt zur Vendimia-Zeit ab Ende Juli - Lese-Stimmung auf den Gütern, morgens fahren, mittags degustieren.",
   meta:"Ab Tequisquiapan/Querétaro · @biketourqueretaro"},

  // ================= Weitere Funde: Surf & Wandern =================
  {cat:"surf", name:"Mazunte & San Agustinillo", lat:15.6676, lng:-96.5537,
   note:"Die Bohème-Ecke der Oaxaca-Küste: sanfte Lernwellen an der Playa Elefantes (Ocean Surf School, Kurse + Verleih) und die Sonnenuntergangs-Wanderung zur Punta Cometa, dem südlichsten Punkt Oaxacas.",
   juli:"Regenzeit = ruhige Saison mit gutmütigeren Wellen als an der Zicatela - ideal zum Surf-Lernen.",
   warn:"An offenen Abschnitten (v. a. Zipolite) starke Rip-Strömungen - nur dort baden, wo Einheimische baden.",
   meta:"1 Std. ab Puerto Escondido, 40 Min. ab Flughafen Huatulco"},
  {cat:"wandern", name:"San José del Pacífico (2500 m)", lat:16.1683, lng:-96.5032,
   note:"Bergdorf im Nebelwald auf halbem Weg zwischen Oaxaca-Stadt und der Küste: alpine Trails mit Wolkenmeer-Blick, Temascal-Schwitzhütten und die berühmte Pilz-Kultur der Region.",
   juli:"Regenzeit = Hochsaison der Pilze und die spektakulärsten Wolkenmeere - Wege matschig, abends kühl auf 2500 m.",
   meta:"2.5 Std. ab Oaxaca Richtung Küste · idealer Zwischenstopp nach Mazunte"},
  {cat:"wandern", name:"Sierra Gorda (Querétaro)", lat:21.3841, lng:-99.3265,
   note:"Biosphärenreservat über einen Drittel des Bundesstaats: Nebelwald, Wasserfälle, Höhlen, Aras - und die fünf UNESCO-Franziskanermissionen. Der grosse Übersehene unter Mexikos Naturräumen: kaum Besucher.",
   juli:"Regenzeit füllt die Wasserfälle (Chuvejé, El Chuveje-Trail), in den Tallagen schwül - Missionen-Route als Schlechtwetter-Programm.",
   warn:"Kurvenreiche Bergstrecke ab Querétaro (3.5 Std.) - tagsüber fahren.",
   meta:"Basis Jalpan de Serra"},

  // ================= Nachprüfung (2. Durchgang) =================
  {cat:"surf", name:"Sayulita & Punta Mita (Nayarit)", lat:20.8689, lng:-105.4407,
   note:"Das Surf-Lerndorf des Pazifiks: sanfte Wellen direkt am Ort, dazu die Point Breaks um Punta de Mita - El Anclote (lang und gutmütig, auch SUP) und La Lancha für Fortgeschrittene. Ruhigere Alternative nebenan: San Pancho mit botanischem Garten und der Cerro-del-Mono-Wanderung.",
   juli:"Regenzeit = warme, leerere Wellen und grünes Hinterland - schwül, aber surfbar. Wichtig: Nayarit steht auf keiner EDA-Warnliste (anders als Jalisco nebenan).",
   warn:"Anreise via Flughafen Puerto Vallarta (Jalisco, EDA-Vorsicht): Transfer tagsüber direkt nach Sayulita (45 Min.).",
   meta:"Boards/Kurse überall im Ort · Zeitzonen-Falle: Sayulita tickt auf Mexiko-Stadt-Zeit"},
  {cat:"tauch", name:"Islas Marietas (Punta Mita)", lat:20.6989, lng:-105.5851,
   note:"Geschützter Marine-Nationalpark 10 km vor Punta de Mita: Riff-Fische, Mantas, Schildkröten - und die berühmte Playa Escondida im Vulkankrater, erreichbar nur schwimmend durch einen 200-m-Lavatunnel (limitiert auf 116 Personen/Tag). Schnorcheltouren ab ca. 85 USD, Tauch-Tagesausflüge ab ca. 160 USD, auch für frische PADI-Brevets.",
   juli:"Sommer = warmes, ruhiges Wasser in der Bucht; Hidden-Beach-Permit früh sichern (Kontingent).",
   meta:"Boote ab El Anclote/Punta de Mita"},
  {cat:"tiere", name:"Isla Contoy: Vogelinsel", lat:21.4972, lng:-86.7939,
   note:"Nationalpark an der Nordspitze der Halbinsel, wo Golf und Karibik sich treffen: über 170 Vogelarten (Fregattvögel, Pelikane), Mangroven-Trail, 27-m-Aussichtsturm, Traumstrand - Tagesausflüge streng limitiert.",
   juli:"Flamingos sind April-September auf der Insel - Juli passt. Gut mit der Walhai-Tour kombinierbar (gleiches Revier).",
   meta:"1-2 Std. ab Cancún/Isla Mujeres, ca. 145 USD inkl. Schnorchel-Stopp"},
  {cat:"kajak", name:"Jalcomulco: Wildwasser (Veracruz)", lat:19.3351, lng:-96.7527,
   note:"Mexikos Rafting-Hauptstadt am Río Antigua: Stromschnellen für alle Levels, dazu Höhlen, Badestellen und Temascal-Camps im Dschungeltal. Gilt als eines der besten Wildwasser-Reviere des Landes (technischere Alternative: Río Filobobos bei Tlapacoyan).",
   juli:"Regenzeit = viel Wasser auf den Rapids, Hochsaison fürs Rafting. Vorab bei einem etablierten Anbieter buchen (Mindestteilnehmerzahl).",
   warn:"Veracruz steht auf der EDA-Vorsichtsliste - organisiert mit Anbieter reisen (45 Min. ab Xalapa), tagsüber.",
   meta:"Anbieter mit Camp buchen, Wochenenden voll"},
  {cat:"wandern", name:"Aqueduct Trail (San Agustín Etla)", lat:17.2040, lng:-96.7181,
   note:"Stiller Wander-Klassiker bei Oaxaca: 9.6 km dem Aquädukt aus dem 19. Jh. entlang, mit Weitblick übers Valle de Etla, bis zur verlassenen (angeblich verwunschenen) Wasserkraftzentrale La Planta. Vorher Kunststopp im CASA-Kulturzentrum in der alten Textilfabrik.",
   juli:"Vormittags gehen (Gewitterlogik des Hochlands); vorab Registrierung bei der Agencia Municipal ist offiziell verlangt.",
   meta:"45 Min. ab Oaxaca-Stadt · Start östlich vom CASA"},

  // ================= Südamerika-Alternativen (Juli = Anden-Trockenzeit; EDA-geprüft) =================
  {cat:"sam", name:"Cusco & Heiliges Tal (Peru)", lat:-13.5171, lng:-71.9785,
   note:"Machu Picchu, Pisac, Ollantaytambo und die Inka-Hauptstadt selbst - 🥾 Tageswanderungen und Mehrtages-Treks (Salkantay statt dem ausgebuchten Inka-Trail).",
   juli:"Trockenzeit-Höhepunkt: stabil sonnig, nachts kalt - aber auch Hochsaison. Machu-Picchu-Tickets Wochen im Voraus; um die Fiestas Patrias (28./29. Juli) ist alles voll.",
   warn:"EDA rät nur von VRAEM-Region und Grenzgebieten ab - die Touristen-Achse Cusco/Valle Sagrado ist davon weit weg.",
   meta:"Flug via Lima · 3400 m, 2 Tage akklimatisieren"},
  {cat:"sam", name:"Huaraz & Cordillera Blanca (Peru)", lat:-9.5299, lng:-77.5290,
   note:"Das Weltklasse-Trekking-Revier Südamerikas: Laguna 69, Santa-Cruz-Trek (4 Tage), Pastoruri - 6000er-Kulisse ohne Permit-Bürokratie. 🥾",
   juli:"Juni-August ist DAS stabile Wetterfenster im Jahr: tagsüber klar, nachts frostig. Vor den Treks 2-3 Tage auf 3000 m akklimatisieren.",
   meta:"8 Std. Bus oder 1 Std. Flug ab Lima (Anta)"},
  {cat:"sam", name:"Colca-Canyon & Arequipa (Peru)", lat:-15.6417, lng:-71.5731,
   note:"Einer der tiefsten Canyons der Welt: Kondore am Cruz del Cóndor, Terrassendörfer, Thermalquellen - dazu die weisse Stadt Arequipa als Basis. 🥾",
   juli:"Trockenzeit: verlässlich klare Morgen für die Kondor-Thermik (vor 9 Uhr dort sein), nachts um den Gefrierpunkt.",
   meta:"Chivay 3600 m · 3 Std. ab Arequipa"},
  {cat:"sam", name:"Titicaca: Kajak ab Llachón (Peru)", lat:-15.7229, lng:-69.7839,
   note:"🛶 Seekajak auf 3800 m: Von der Halbinsel Capachica zu den Inseln Amantaní und Taquile paddeln, übernachtet wird bei Familien im Dorf - das ruhige Gegenprogramm zu den Puno-Massentouren.",
   juli:"Trockenzeit = spiegelglatte Morgen und klare Sicht bis Bolivien; mittags kann Wind aufkommen, nachts deutlich unter null.",
   meta:"1.5 Std. ab Puno · Kajaks bei den Community-Anbietern"},
  {cat:"sam", name:"Chicama & Pacasmayo (Nordperu)", lat:-7.4010, lng:-79.5700,
   note:"🏄 Chicama gilt als längste linke Welle der Welt (bis 2 km Ritt), Pacasmayo nebenan ist ihre grosse Schwester mit Hotel-Reihe am Point - und nachmittags konstantem Wind für 🪁 Wellen-Kiten/-Wingen.",
   juli:"Süd-Swell-Saison auf dem Peak: Juli bringt die zuverlässigsten Tage, dazu Nebelwinter-Grau (Garúa) - Wasser 17-19 Grad, Neopren nötig.",
   meta:"2 Std. ab Trujillo · Boards/Material vor Ort"},
  {cat:"sam", name:"Salar de Uyuni (Bolivien)", lat:-20.4628, lng:-66.8239,
   note:"Die grösste Salzfläche der Welt plus 3-Tages-Tour zu den Farb-Lagunen (Laguna Colorada, Flamingos, Geysire) an der chilenischen Grenze.",
   juli:"Trockenzeit: gleissend weisse Kruste und die klarsten Sternennächte des Jahres - der berühmte Spiegeleffekt gehört aber zur Regenzeit (Dez.-März). Nachts bis -15 Grad, guten Schlafsack verlangen.",
   warn:"EDA Bolivien: Mit Strassenblockaden und Protesten rechnen - Puffertage vor dem Rückflug einplanen.",
   meta:"Ab Uyuni-Stadt (Flug via La Paz) oder ab San Pedro de Atacama"},
  {cat:"sam", name:"Copacabana & Isla del Sol (Bolivien)", lat:-16.1657, lng:-69.0854,
   note:"Die bolivianische Titicaca-Seite: Wanderung über den Grat der Isla del Sol mit Inka-Ruinen und Homestays, Boote ab Copacabana. 🥾",
   juli:"Klar und sonnig bei Tag, eisig bei Nacht - die Aymara-Neujahrsfeste um den 21. Juni klingen im Juli noch nach.",
   warn:"EDA Bolivien: Blockade-Risiko auch auf der Strecke La Paz-Copacabana - Lage vor Fahrten prüfen.",
   meta:"3.5 Std. ab La Paz"},
  {cat:"sam", name:"Galápagos (Ecuador)", lat:-0.7472, lng:-90.3134,
   note:"Juli gehört zur nährstoffreichen Garúa-Saison: Wasser kühler, dafür Tierleben auf Maximum - Blaufusstölpel balzen, Wale und Delfine ziehen durch, Schnorcheln mit Robben und Pinguinen.",
   juli:"Gute Juli-Wahl: aktivste Tierwelt des Jahres, 3-mm-Neopren fürs Schnorcheln (Wasser 20-22 Grad). Land-Hopping ab Puerto Ayora geht auch ohne Kreuzfahrt.",
   warn:"Anreise via Guayaquil: EDA rät von der Stadt ab, der reine Flughafen-Transit ist aber ausdrücklich ausgenommen - oder via Quito fliegen.",
   meta:"Nationalpark-Gebühr + Transitkarte einplanen"},
  {cat:"sam", name:"Quilotoa & Anden-Loop (Ecuador)", lat:-0.8592, lng:-78.9042,
   note:"Türkise Kraterlagune auf 3900 m mit 🛶 Kajak-Verleih unten am Wasser und dem 3-Tages-Wanderloop Sigchos-Chugchilán-Quilotoa von Hostal zu Hostal. 🥾",
   juli:"Im Hochland-Sommer (Jun.-Sept.) am trockensten: morgens klare Kraterblicke, nachmittags Wind. Nachts kalt.",
   warn:"EDA Ecuador: Küstenstädte (Guayaquil, Esmeraldas) und Grenze zu Kolumbien meiden - das Anden-Hochland ist die ruhige Achse.",
   meta:"Ab Latacunga · Busse tagsüber"},
  {cat:"sam", name:"Salento & Valle de Cocora (Kolumbien)", lat:4.6373, lng:-75.5698,
   note:"Kaffeezone: Wanderung durch das Wachspalmen-Tal, Fincas mit Verkostung, buntes Balkon-Städtchen. 🥾",
   juli:"Mitte Juni bis August liegt das kleine Trockenfenster (Veranillo) der Kaffeezone - beste Wandersicht, ewiger Frühling um 22 Grad.",
   warn:"EDA Kolumbien: Abraten gilt für Chocó, Nariño, Putumayo, Arauca, Norte de Santander u. a. - die Kaffeezone liegt ausserhalb; Überlandfahrten trotzdem nur tagsüber.",
   meta:"Flug nach Pereira/Armenia via Bogotá"},
  {cat:"sam", name:"Guatapé & Medellín (Kolumbien)", lat:6.2342, lng:-75.1617,
   note:"Der Stausee mit den tausend Buchten: 740 Stufen auf den Piedra del Peñol, danach 🛶 Kajak/SUP zwischen den Inseln - Basis ist Medellín mit seinem ewigen Frühling.",
   juli:"Juli ist in Antioquia vergleichsweise trocken und mild - Comuna-13- und Guatapé-Tage gut kombinierbar.",
   meta:"2 Std. ab Medellín · unter der Woche ruhiger"},
  {cat:"sam", name:"Lago Calima: Wind-See (Kolumbien)", lat:3.8925, lng:-76.4955,
   note:"🪁 Einer der windsichersten Binnenseen Südamerikas (1486 m): Thermik ab ca. Mittag, den ganzen Nachmittag. Schulen am Nordufer bei Darién, u. a. Wingfoil Colombia (Club Náutico El Brujo, Wing-Basiskurs ab ca. 290'000 COP), Calima Kitesurf School, Pescao. Wasser konstant 18-20 Grad - Shorty mitnehmen.",
   juli:"Juni-September sind die stärksten Windmonate (nachmittags typisch 15-25 Knoten) - genau dann, wenn in Mexiko der Passat abflaut. Aber: Thermik braucht Sonne, an Regentagen kein Wind. Unter der Woche fast leer, am Wochenende kommt Cali.",
   warn:"Anfahrt ab Cali tagsüber auf der Hauptroute; Buenaventura-Richtung (Chocó-Küste) meiden (EDA).",
   meta:"Direktflug MEX-Cali (Avianca, 6x/Wo.) · TransCalima-Bus ab Terminal Cali, 3. Stock, stündlich 6-19 Uhr, ~16'000 COP, 2.5 Std."},
  {cat:"sam", name:"Jericoacoara (Brasilien)", lat:-2.8986, lng:-40.4506,
   note:"Sandstrassen-Dorf zwischen Dünen und Flachwasser-Lagunen (Tatajuba, Guriú): 🪁 Wing- und Kite-Mekka mit Schulen, dazu Capoeira-Sonnenuntergang auf der Düne.",
   juli:"Die Passat-Saison startet genau jetzt (Juli-Januar) und wird bis Oktober immer stabiler - Juli ist der entspannte Saisonauftakt mit weniger Betrieb.",

// ---------- Karte ----------
const map = L.map('map', {zoomControl:true});
const HOME_BOUNDS = [[15.0,-101.5],[22.6,-86.4]];
map.fitBounds(HOME_BOUNDS, {padding:[10,10]});
// Falls der Viewport beim Laden noch 0x0 ist (eingebettete Browser): nachziehen
let hadSize = innerWidth > 0 && innerHeight > 0;
window.addEventListener('resize', () => {
  map.invalidateSize();
  if(!hadSize && innerWidth > 0 && innerHeight > 0){
    hadSize = true;
    map.fitBounds(HOME_BOUNDS, {padding:[10,10]});
  }
});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CARTO · Zonen: EDA-Reisehinweise 11.02.2026', maxZoom:19
}).addTo(map);

// ---------- EDA-Zonen ----------
const zoneStyle = lvl => lvl === 'red'
  ? {color:'#c22a1e', weight:1, opacity:.5, fillColor:'#c22a1e', fillOpacity:.20, interactive:true}
  : {color:'#d98a1f', weight:1, opacity:.45, fillColor:'#d98a1f', fillOpacity:.14, interactive:true};
const zoneLayer = L.layerGroup();
ZONES.forEach(z => {
  const gj = L.geoJSON(z.g, {style: zoneStyle(z.lvl)});
  gj.bindTooltip(z.n + ' - EDA: ' + (z.lvl === 'red' ? 'von Reisen abgeraten' : 'erhöhte Vorsicht'), {sticky:true});
  gj.addTo(zoneLayer);
});
zoneLayer.addTo(map);
document.getElementById('zoneToggle').addEventListener('change', e => {
  if(e.target.checked) zoneLayer.addTo(map); else map.removeLayer(zoneLayer);
});

// ---------- Marker ----------
const markers = [];
PLACES.forEach(p => {
  const badge = p.warn ? '<span class="pin-badge">!</span>' : '';
  const icon = L.divIcon({
    className:'',
    html:`<div class="pin ${p.cat}">${CATS[p.cat].emoji}${badge}</div>`,
    iconSize:[38,38], iconAnchor:[19,36]
  });
  const m = L.marker([p.lat, p.lng], {icon}).addTo(map);
  m.on('click', () => openSheet(p));
  m._cat = p.cat;
  markers.push(m);
});

// ---------- Bottom Sheet ----------
const sheet = document.getElementById('sheet');
function openSheet(p){
  document.getElementById('sheetTag').textContent = CATS[p.cat].emoji + ' ' + CATS[p.cat].label;
  document.getElementById('sheetTag').className = 'tag ' + p.cat;
  document.getElementById('sheetTitle').textContent = p.name;
  document.getElementById('sheetNote').textContent = p.note;
  document.getElementById('sheetJuli').textContent = p.juli ? '🗓️ Juli: ' + p.juli : '';
  document.getElementById('sheetWarn').textContent = p.warn ? '⚠️ ' + p.warn : '';
  document.getElementById('sheetMeta').textContent = p.meta || '';
  const route = document.getElementById('sheetRoute');
  route.style.display = '';
  route.href = 'https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lng;
  sheet.classList.add('open');
  map.panTo([p.lat, p.lng], {animate:true});
}
map.on('click', () => sheet.classList.remove('open'));

// Swipe nach unten schliesst das Sheet
let startY = null;
sheet.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, {passive:true});
sheet.addEventListener('touchmove', e => {
  if(startY !== null && e.touches[0].clientY - startY > 60){
    sheet.classList.remove('open'); startY = null;
  }
}, {passive:true});

// ---------- Filter ----------
const state = {};
Object.keys(CATS).forEach(k => state[k] = true);
const allOn = () => Object.keys(CATS).every(k => state[k]);
function applyFilter(){
  markers.forEach(m => {
    if(state[m._cat]) m.addTo(map); else map.removeLayer(m);
  });
  document.querySelectorAll('.chip').forEach(c => {
    const cat = c.dataset.cat;
    if(cat === 'all'){
      c.classList.toggle('off', !allOn());
    } else {
      c.classList.toggle('off', !state[cat]);
    }
  });
}
document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  const cat = chip.dataset.cat;
  if(cat === 'all'){
    Object.keys(CATS).forEach(k => state[k] = true);
  } else {
    if(allOn()){
      Object.keys(CATS).forEach(k => state[k] = false);
      state[cat] = true;
    } else {
      state[cat] = !state[cat];
      if(Object.keys(CATS).every(k => !state[k])){
        Object.keys(CATS).forEach(k => state[k] = true);
      }
    }
  }
  applyFilter();
  sheet.classList.remove('open');
  // Südamerika-Chip allein aktiv -> Ansicht dorthin; zurück -> Mexiko-Ansicht
  const aktiv = Object.keys(CATS).filter(k => state[k]);
  if(aktiv.length === 1 && aktiv[0] === 'sam'){
    const b = L.latLngBounds(markers.filter(m => m._cat === 'sam').map(m => m.getLatLng()));
    map.fitBounds(b, {padding:[40,40]});
    samView = true;
  } else if(samView){
    map.fitBounds(HOME_BOUNDS, {padding:[10,10]});
    samView = false;
  }
});
let samView = false;
applyFilter();

// ---------- Eigener Standort (kein Autostart - Karte soll auf Mexiko bleiben) ----------
const locateBtn = document.getElementById('locateBtn');
let watchId = null, meMarker = null, meCircle = null, firstFix = true;
const meIcon = L.divIcon({className:'', html:'<div class="me-dot"></div>', iconSize:[18,18], iconAnchor:[9,9]});
function onFix(pos){
  const ll = [pos.coords.latitude, pos.coords.longitude];
  if(!meMarker){
    meMarker = L.marker(ll, {icon:meIcon, zIndexOffset:1000, interactive:false}).addTo(map);
    meCircle = L.circle(ll, {radius:pos.coords.accuracy, color:'#1a73e8', weight:1, opacity:.4,
      fillColor:'#1a73e8', fillOpacity:.1, interactive:false}).addTo(map);
  } else {
    meMarker.setLatLng(ll);
    meCircle.setLatLng(ll).setRadius(pos.coords.accuracy);
  }
  if(firstFix){ map.setView(ll, Math.max(map.getZoom(), 12), {animate:true}); firstFix = false; }
}
function onErr(){ stopLocate(); alert('Standort nicht verfügbar (Ortung erlauben, braucht HTTPS).'); }
function startLocate(){
  if(!('geolocation' in navigator)){ alert('Dieses Gerät unterstützt keine Ortung.'); return; }
  firstFix = true;
  watchId = navigator.geolocation.watchPosition(onFix, onErr, {enableHighAccuracy:true, maximumAge:10000, timeout:15000});
  locateBtn.classList.add('active');
}
function stopLocate(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  if(meMarker){ map.removeLayer(meMarker); meMarker = null; }
  if(meCircle){ map.removeLayer(meCircle); meCircle = null; }
  locateBtn.classList.remove('active');
}
locateBtn.addEventListener('click', () => {
  if(watchId !== null){
    if(meMarker) map.setView(meMarker.getLatLng(), Math.max(map.getZoom(), 12), {animate:true});
    else stopLocate();
  } else { startLocate(); }
});
locateBtn.addEventListener('dblclick', stopLocate);
</script>
